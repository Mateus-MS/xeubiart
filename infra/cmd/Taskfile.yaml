version: '3'

tasks:
  db:
    dir: '.'
    cmds:
      - docker compose --env-file ../../.env -f compose.postgres.yml up -d postgres
  
  db:stop:
    dir: '.'
    cmds:
      - docker compose --env-file ../../.env -f compose.postgres.yml down

  db:reset:
    dir: '.'
    cmds:
      - docker compose --env-file ../../.env -f compose.postgres.yml down -v
      - docker compose --env-file ../../.env -f compose.postgres.yml up -d postgres

  caddy:
    dir: '../../infra'
    cmds:
      - caddy run --config ./caddy/Caddyfile.local

  angular:
    dir: '../../frontend/angular'
    cmds:
      - npm start

  templ:
    dir: '../../frontend/templ'
    cmds:
      - go tool templ generate --watch --cmd="go run main.go"

  tailwind:
    dir: '../../frontend/tailwind'
    cmds:
      - npx @tailwindcss/cli -i ./input.css -o ./dist/tailwind.css --watch

  ui:
    dir: '../../frontend/ui'
    cmds:
      - npx vite build --watch

  dev:
    deps:
      - db
      - caddy
      - angular
      - templ
      - tailwind
      - ui
      
  # Main command to run on a fresh clone
  init:
    desc: Install all dependencies and prepare project for development
    cmds:
      - task: init:go
      - task: init:angular
      - task: init:tailwind
      - task: init:ui
      - task: init:spring
      - task: generate:templ
      - task: build:tailwind
      - task: build:ui
      - cmd: echo "Init complete! You can now run 'task dev'."
        silent: true

  # --- Granular Init Tasks ---

  init:go:
    desc: Download Go modules
    dir: '../../frontend/templ'
    cmds:
      - go mod download

  init:angular:
    desc: Install Angular dependencies
    dir: '../../frontend/angular'
    cmds:
      - npm install

  init:tailwind:
    desc: Install Tailwind CLI and dependencies
    dir: '../../frontend/tailwind'
    cmds:
      - npm install

  init:ui:
    desc: Install Shared UI Web Component dependencies
    dir: '../../frontend/ui'
    cmds:
      - npm install

  init:spring:
    desc: Download Spring Boot dependencies
    dir: '../../backend'
    cmds:
      - mvnw.cmd dependency:go-offline

  # --- Build / Prep Tasks ---

  generate:templ:
    desc: Generate Go code from Templ templates
    dir: '../../frontend/templ'
    cmds:
      - go tool templ generate

  build:tailwind:
    desc: Initial Tailwind CSS build
    dir: '../../frontend/tailwind'
    cmds:
      - npx @tailwindcss/cli -i ./input.css -o ./dist/tailwind.css

  build:ui:
    desc: Initial Shared UI build
    dir: '../../frontend/ui'
    cmds:
      - npx vite build