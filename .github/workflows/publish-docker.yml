name: Publish Xeubiart Packages

on:
  push:
    tags:
      - 'v*' # Only trigger on version tags like v1.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Version Tag
        id: vars
        run: |
          # Strips 'refs/tags/v' to leave just the version number (e.g., 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Push Templ Service
        uses: docker/build-push-action@v6
        with:
          context: frontend/templ
          file: frontend/templ/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xeubiart-templ:${{ steps.vars.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/xeubiart-templ:latest

      - name: Build and Push Caddy Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/caddy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xeubiart-caddy:${{ steps.vars.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/xeubiart-caddy:latest