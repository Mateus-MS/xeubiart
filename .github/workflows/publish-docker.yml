name: Publish Xeubiart Packages

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Templ Service
        uses: docker/build-push-action@v6
        with:
          context: frontend/templ
          file: frontend/templ/Dockerfile
          push: true
          tags: ghcr.io/mateus-ms/xeubiart-frontend:latest

      - name: Build and Push Caddy Service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/caddy/Dockerfile
          push: true
          tags: ghcr.io/mateus-ms/xeubiart-infra:latest