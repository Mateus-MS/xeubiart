name: Publish Xeubiart Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # <-- ADD THIS LINE
    inputs:
      version:
        description: 'Version tag to publish (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Version Tag
        id: vars
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and Push Templ Service
        uses: docker/build-push-action@v5
        with:
          context: frontend/templ
          file: frontend/templ/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xeubiart-frontend:${{ steps.vars.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/xeubiart-frontend:latest

      - name: Build and Push Caddy Service
        uses: docker/build-push-action@v5
        with:
          context: infra/caddy
          file: infra/caddy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/xeubiart-infra:${{ steps.vars.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/xeubiart-infra:latest