@if(isOpen()){
    <div
        (click)="close()" 
        class="fixed inset-0 w-full h-full bg-black/25 backdrop-blur-xs flex justify-end z-1000"
    >
        <div 
            (click)="$event.stopPropagation()"    
            class="w-[max(40%,500px)] h-full right-0 top-0 bg-cream shadow-[-20px_0_60px_rgba(0,0,0,0.18)] flex flex-col"
        >
            <!-- Header -->
            <div class="gap-1 px-8 py-4 shrink-0 bg-white bg-white border-b-cherry/25 border-b-1 font-contrast">
                @if(isEditing){
                    <span class="text-xl tracking-widest text-cherry">Editando trabalho</span>
                } @else {
                    <span class="text-xl tracking-widest text-cherry">Criando trabalho</span>
                }
            </div>

            <!-- Body -->
            <div class="h-full grow w-full min-h-0 overflow-y-auto px-8 py-8 flex flex-col gap-5">
                <div class="flex gap-4">
                    <ui-input 
                        class="w-full"
                        label="Titulo do trabalho"
                        placeholder="Insira um titulo para o projeto."
                        [(value)]="title"
                    />
                    <ui-dropdown 
                        class="w-full"
                        label="Estilos" 
                        placeholder="Selecionar um estilo"
                        [(value)]="style"
                        [options]="tattooStyles"
                    />
                </div>
                <ui-input 
                    multiline 
                    placeholder="Insira uma descrição para o projeto." 
                    label="Descrição"
                    [(value)]="description"
                />
                <div>
                    <h2 class="text-xs font-semibold">Fotos do trabalho</h2>
                    <span class="text-muted text-xs block mb-4">Clique em "Capa" para definir a foto principal deste trabalho.</span>
                    <app-file-upload-wrapper
                        [files]="uploadedFiles()"
                        (filesSelected)="onFilesSelected($event)"
                        (fileRemoved)="onFileRemoved($event)"
                        (filesReordered)="onFilesReordered($event)"
                    />
                </div>
                <app-visibility-toggler
                    [isActive]="visible()"
                    (isActiveChange)="visible.set($event)"
                />
            </div>

            <!-- Footer/Actions -->
            <div class="shrink-0 bg-white border-t-1 border-t-cherry/25 flex justify-between px-8 py-4">
                <ui-button type="light">Cancelar</ui-button>
                @if(isEditing){
                    <ui-button type="heavy" [disabled]="!canCreateWork()" (click)="createWork()"><i class="icon-check"></i> Salvar alterações</ui-button>
                } @else {
                    <ui-button type="heavy" [disabled]="!canCreateWork()" (click)="createWork()"><i class="icon-check"></i> Criar novo trabalho</ui-button>
                }
            </div>
        </div>
    </div>
}
