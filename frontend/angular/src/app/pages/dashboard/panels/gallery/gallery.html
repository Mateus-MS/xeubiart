<div class="flex flex-col gap-6 px-5 py-10">
    <div class="grid gap-10 grid-cols-2">
        <div class="flex flex-col gap-3">
            <ui-eyebrow type="cherry">Portifólio público</ui-eyebrow>
            <ui-title level="h2">Galeria de <em>trabalhos.</em></ui-title>
            <p class="text-muted text-sm">Organize os trabalhos que aparecem no seu portfólio. Você pode ocultar peças temporariamente, reordenar fotos e atualizar descrições.</p>
        </div>
        <div class="place-self-end">
            <ui-button (click)="openChildPopup()">
                <i class="icon-plus"></i> Novo trabalho
            </ui-button>
        </div>
    </div>
    <div class="w-full flex justify-between">
        <ui-tab-switcher 
            (tab-change)="handleVisibilityStateChange($event)" 
            [tabs]="['Todos', 'Visíveis', 'Ocultos']"
        ></ui-tab-switcher>
        <ui-input type="number" icon="icon-search" placeholder="Busque por nome ou estilo"></ui-input>
    </div>
</div>

<app-item-popup></app-item-popup>
