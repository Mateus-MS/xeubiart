<div class="flex flex-col gap-6 px-5 pb-10 max-w-[70%] mx-auto">
    <div class="bg-cream z-10 py-10">
        <div class="grid gap-10 grid-cols-2 mb-4">
            <div class="flex flex-col gap-3">
                <ui-eyebrow type="cherry">Portifólio público</ui-eyebrow>
                <ui-title level="h2">Galeria de <em>trabalhos.</em></ui-title>
                <p class="text-muted text-sm">Organize os trabalhos que aparecem no seu portfólio. Você pode ocultar peças temporariamente, reordenar fotos e atualizar descrições.</p>
            </div>
            <div class="place-self-end">
                <ui-button (click)="openChildPopup()">
                    <i class="icon-plus"></i> Novo trabalho
                </ui-button>
            </div>
        </div>
        <div class="w-full flex justify-between">
            <ui-tab-switcher 
                (tab-change)="handleVisibilityStateChange($event)" 
                [tabs]="[
                    {
                        label: 'Todos os trabalhos',
                        value: 'all'
                    },
                    {
                        label: 'Visíveis',
                        value: 'visible'
                    },
                    {
                        label: 'Ocultos',
                        value: 'hidden'
                    }
                ]"
            ></ui-tab-switcher>
            <ui-input type="number" icon="icon-search" placeholder="Busque por nome ou estilo" classes="w-[300px]"></ui-input>
        </div>
    </div>

    <div class="grid grid-cols-[repeat(auto-fill,minmax(260px,1fr))] gap-5">
        @for (work of works(); track work.id) {
            <app-item-card [work]="work" (visibilityChange)="handleUpdateVisibility($event)" (openEditPopup)="handleOpenEditPopup($event)" />
        }
    </div>
</div>

<app-item-popup (submitWorkEvent)="handleSubmitWork($event)"></app-item-popup>
